# ================================================================
# Test profile — used by all integration tests in ecommerce-app.
# Testcontainers provides real DB / Redis / Kafka containers;
# Spring Boot's @ServiceConnection wires the connection details
# automatically — no manual host/port overrides needed here.
# ================================================================

spring:
  # ── JPA ──────────────────────────────────────────────────────
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; Hibernate only validates

  # ── Flyway ───────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 5
    connect-retries-interval: 2s

  # ── Kafka ────────────────────────────────────────────────────
  # bootstrap-servers is injected by @ServiceConnection from KafkaContainer.
  # Disable auto-topic creation to speed up tests — topics are created
  # programmatically via KafkaConfig beans.
  kafka:
    consumer:
      auto-offset-reset: earliest
    admin:
      auto-create: true

  # ── Mail ─────────────────────────────────────────────────────
  mail:
    host: localhost
    port: 3025     # no real mail server in tests; listener is @Async so it won't block
    properties:
      mail.smtp.auth:      false
      mail.smtp.starttls:  false

# ── Logging ──────────────────────────────────────────────────────
logging:
  level:
    com.ecommerce:          DEBUG
    org.springframework:    WARN
    org.hibernate.SQL:      WARN
    org.testcontainers:     INFO
    tc:                     INFO

# ── App ──────────────────────────────────────────────────────────
app:
  jwt:
    secret:                       dGVzdFNlY3JldEtleVRoYXRJc0F0TGVhc3QzMkNoYXJhY3RlcnNMb25n
    access-token-expiry-seconds:  3600
    refresh-token-expiry-seconds: 86400
    issuer:                       ecommerce-platform
  notification:
    from-address: test@ecommerce.example.com
