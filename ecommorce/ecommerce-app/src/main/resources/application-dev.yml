# Development profile — verbose logging, SQL output, dev mail server
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: localhost
    port: 1025   # MailHog / MailPit local dev server

logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

server:
  error:
    include-message: always
    include-binding-errors: always
