# ================================================================
# Kubernetes profile — active when SPRING_PROFILES_ACTIVE=k8s
# Overrides defaults from application.yml that are not
# suitable for containerised/orchestrated environments.
# ================================================================

spring:
  # ── JPA ──────────────────────────────────────────────────────
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ── Flyway ───────────────────────────────────────────────────
  flyway:
    enabled: true
    # Connect-retry gives Flyway time to wait for Postgres to be ready
    # (avoids a race condition during pod startup before the DB is up).
    connect-retries:             10
    connect-retries-interval:    5s

  # ── Redis ────────────────────────────────────────────────────
  data:
    redis:
      # In k8s, Redis runs as a ClusterIP service; no client-side TLS needed
      # unless using a managed Redis with in-transit encryption.
      ssl:
        enabled: false

  # ── Kafka ────────────────────────────────────────────────────
  kafka:
    # Trust every certificate — replace with a proper truststore for mTLS
    properties:
      security.protocol: PLAINTEXT

# ── Server ───────────────────────────────────────────────────────
server:
  # The frontend nginx proxy and k8s ingress handle HTTPS termination;
  # the backend listens on plain HTTP inside the cluster.
  port: 8080
  tomcat:
    # Use the real client IP passed by the ingress controller
    remoteip:
      remote-ip-header:     X-Real-IP
      protocol-header:      X-Forwarded-Proto
      internal-proxies:     10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}

# ── Actuator ─────────────────────────────────────────────────────
management:
  endpoint:
    health:
      # Expose individual liveness and readiness probes for k8s probes
      probes:
        enabled: true
      show-details: always
      show-components: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Kafka consumer lag check — mark NOT_READY if consumers fall behind
    kafka:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,liveness,readiness

# ── Logging ──────────────────────────────────────────────────────
# Structured JSON logging for log aggregation (Loki / ELK / CloudWatch)
logging:
  structured:
    format:
      console: ecs        # Elastic Common Schema — works with Logstash/Loki
  level:
    com.ecommerce:           INFO
    org.springframework:     WARN
    org.hibernate:           WARN
    # Reduce Kafka noise in prod
    org.apache.kafka:        WARN
    kafka.server:            WARN

# ── App-specific ─────────────────────────────────────────────────
app:
  jwt:
    # All JWT settings come from the ecommerce-api-secrets Secret and
    # ecommerce-api-config ConfigMap — not hardcoded here.
    issuer: ecommerce-platform
