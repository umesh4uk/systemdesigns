apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-api-config
  labels:
    app: ecommerce-api
data:
  # Spring Boot
  SPRING_PROFILES_ACTIVE: "k8s"
  SERVER_PORT:             "8080"

  # Database (host/port/name from env; credentials from Secret)
  DB_URL: "jdbc:postgresql://ecommerce-postgres:5432/ecommerce"

  # Redis
  REDIS_HOST: "ecommerce-redis"
  REDIS_PORT: "6379"

  # Kafka
  KAFKA_BOOTSTRAP_SERVERS: "ecommerce-kafka:9092"

  # Mail
  MAIL_HOST: "smtp.example.com"
  MAIL_PORT: "587"

  # JVM tuning
  JAVA_OPTS: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=75.0
    -XX:+ExitOnOutOfMemoryError
    -Djava.security.egd=file:/dev/./urandom

  # Notification
  NOTIFICATION_FROM: "noreply@ecommerce.example.com"
