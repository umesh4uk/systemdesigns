# IMPORTANT: Never commit real secret values to source control.
# This file shows the expected Secret shape only — populate via:
#   • kubectl create secret generic ecommerce-api-secrets --from-env-file=.env.prod
#   • External Secrets Operator (ESO) pulling from AWS Secrets Manager / Vault
#   • Sealed Secrets (Bitnami) — encrypt and commit the SealedSecret CRD
#
# Values shown are placeholders (base64 of "CHANGE_ME").
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-api-secrets
  labels:
    app: ecommerce-api
type: Opaque
stringData:
  DB_USERNAME:         "CHANGE_ME"
  DB_PASSWORD:         "CHANGE_ME"
  REDIS_PASSWORD:      ""
  JWT_SECRET:          "CHANGE_ME_base64_encoded_256bit_key"
  MAIL_USERNAME:       "CHANGE_ME"
  MAIL_PASSWORD:       "CHANGE_ME"
