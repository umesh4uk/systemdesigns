# In-cluster Postgres — suitable for staging/dev clusters.
# For production, use a managed service (RDS, Cloud SQL, etc.).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-postgres
  labels:
    app: ecommerce-postgres
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-postgres
  strategy:
    type: Recreate           # single replica + persistent volume — use Recreate
  template:
    metadata:
      labels:
        app: ecommerce-postgres
    spec:
      securityContext:
        fsGroup: 999         # postgres group
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name:  POSTGRES_DB
              value: ecommerce
            - name:  POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ecommerce-api-secrets
                  key:  DB_USERNAME
            - name:  POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-api-secrets
                  key:  DB_PASSWORD
            - name:  PGDATA
              value: /var/lib/postgresql/data/pgdata

          resources:
            requests:
              cpu:    100m
              memory: 256Mi
            limits:
              cpu:    500m
              memory: 512Mi

          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ecommerce"]
            initialDelaySeconds: 20
            periodSeconds: 10

          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ecommerce"]
            initialDelaySeconds: 10
            periodSeconds: 5

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-postgres
  labels:
    app: ecommerce-postgres
spec:
  type: ClusterIP
  selector:
    app: ecommerce-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  labels:
    app: ecommerce-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
