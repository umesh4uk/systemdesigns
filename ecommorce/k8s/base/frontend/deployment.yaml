apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-frontend
  labels:
    app: ecommerce-frontend
    app.kubernetes.io/name: ecommerce-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ecommerce-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ecommerce-frontend
        app.kubernetes.io/name: ecommerce-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser:    101        # nginx user
        runAsGroup:   101
      terminationGracePeriodSeconds: 30

      containers:
        - name: frontend
          image: ghcr.io/YOUR_ORG/ecommerce-frontend:latest   # patched by Kustomize
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu:    50m
              memory: 64Mi
            limits:
              cpu:    200m
              memory: 128Mi

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds:       15

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds:       10

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false   # nginx writes to /var/cache/nginx
            capabilities:
              drop: [ALL]
              add:  [NET_BIND_SERVICE]

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ecommerce-frontend
                topologyKey: kubernetes.io/hostname
