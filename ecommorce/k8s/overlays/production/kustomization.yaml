apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce

bases:
  - ../../base

# Image tag is replaced by the CD pipeline before kubectl apply
images:
  - name: ghcr.io/YOUR_ORG/ecommerce-api
    newTag: IMAGE_TAG_API
  - name: ghcr.io/YOUR_ORG/ecommerce-frontend
    newTag: IMAGE_TAG_FRONTEND

# Production: 3 API replicas, full resources, stricter rate limits
patches:
  - target:
      kind:      Deployment
      name:      ecommerce-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3

  - target:
      kind:      Deployment
      name:      ecommerce-frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

  - target:
      kind:      HorizontalPodAutoscaler
      name:      ecommerce-api
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20

  - target:
      kind:      ConfigMap
      name:      ecommerce-api-config
    patch: |
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: "k8s,production"

  - target:
      kind:      Ingress
      name:      ecommerce-ingress
    patch: |
      - op: replace
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1limit-rpm
        value: "300"

commonLabels:
  environment: production
