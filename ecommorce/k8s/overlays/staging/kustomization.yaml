apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce-staging

bases:
  - ../../base

# Image tag is replaced by the CD pipeline before kubectl apply
images:
  - name: ghcr.io/YOUR_ORG/ecommerce-api
    newTag: IMAGE_TAG_API
  - name: ghcr.io/YOUR_ORG/ecommerce-frontend
    newTag: IMAGE_TAG_FRONTEND

# Staging: fewer replicas, lower resource limits
patches:
  - target:
      kind:      Deployment
      name:      ecommerce-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  - target:
      kind:      Deployment
      name:      ecommerce-frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind:      Ingress
      name:      ecommerce-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.ecommerce.example.com
      - op: replace
        path: /spec/rules/1/host
        value: staging.ecommerce.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.ecommerce.example.com
      - op: replace
        path: /spec/tls/0/hosts/1
        value: api.staging.ecommerce.example.com
      - op: replace
        path: /spec/tls/0/secretName
        value: ecommerce-staging-tls

  - target:
      kind:      ConfigMap
      name:      ecommerce-api-config
    patch: |
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: "k8s,staging"
      - op: replace
        path: /data/DB_URL
        value: "jdbc:postgresql://ecommerce-postgres-staging:5432/ecommerce_staging"

commonLabels:
  environment: staging
